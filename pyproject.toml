[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelmem"
version = "1.0.0"
description = "Real-Time 3D Spatial Virtual Memory & Heap Allocation Hologram with Three.js WebGL and Cyberpunk Braille Radar"
readme = "README.md"
authors = [
    { name = "Saarthak Ojha", email = "vedantojha2612@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "virtual-memory",
    "heap-allocation",
    "memory-profiler",
    "fragmentation",
    "hilbert-curve",
    "procfs",
    "threejs",
    "terminal-graphics",
    "cyberpunk",
    "webgl",
    "systems-programming",
    "telemetry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
voxelmem = "cli:main"

[project.urls]
Homepage = "https://github.com/vedantojha2612-cyber/voxelmem"
Repository = "https://github.com/vedantojha2612-cyber/voxelmem"
IssueTracker = "https://github.com/vedantojha2612-cyber/voxelmem/issues"
